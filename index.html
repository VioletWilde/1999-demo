<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>微小世界 · 沙盘漫游</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css?v=cover-view-2"></head><body>
<canvas id="map" aria-label="可拖动和缩放的剧情沙盘"></canvas>
<header class="wander-header"><button id="timeline-open" class="back" aria-label="展开当前章节片段">‹</button><div class="chapter"><div id="chapter-label" class="label"></div><h1 id="chapter-name"></h1><p id="chapter-subtitle"></p></div><nav><button id="album-open">章节</button><button id="favorite" aria-pressed="false">收藏</button><button id="more-open" aria-expanded="false" aria-controls="more">更多 ···</button></nav></header>
<div id="more" class="menu" hidden><h2>继续探索</h2><button id="random">随遇一幕 <span>随机走进另一处风景</span></button><button id="tour" aria-pressed="false">沿途漫游 <span>依次欣赏本章片段</span></button><button id="home">回到这一幕 <kbd>Home</kbd></button><button id="hide-ui">隐藏界面 <kbd>U</kbd></button><button id="full">全屏欣赏</button><button id="help-open">漫游提示</button></div>
<footer class="scene-footer"><div class="timeline-top"><span id="scene-date"></span><button id="timeline-position" aria-label="展开完整时间轴"></button><div class="step-controls"><button id="previous">← 上一幕</button><button id="next">下一幕 →</button></div></div><nav id="neighbors" class="episodes" aria-label="横向滚动选择章节片段"></nav><div class="ruler"></div></footer>
<button id="restore-ui" class="restore-ui" aria-label="显示界面（快捷键 U）" title="显示界面 · U" hidden>显示界面</button>
<div id="toast" class="toast" role="status"></div><div id="intro" class="intro" hidden><p>拖动探索四周，滚轮或双指拉近视野。<br>底部可横向滚动选择片段，点击进度展开时间轴。</p><button id="intro-close">开始探索 →</button></div>
<div id="loading" class="loading" role="status" hidden><span class="loading-orbit"></span><p>走进下一幕…</p></div><div id="error" class="error" role="alert" hidden><p>这一幕暂时无法打开，请重试。</p><button id="retry">再试一次</button><button id="error-album">选择章节</button></div>
<dialog id="album" class="sheet catalog"><header><div><small>选择一个故事</small><h2>章节目录</h2></div><button id="album-close" class="close" aria-label="关闭章节目录">×</button></header><input id="album-search" type="search" placeholder="搜索章节或片段…" aria-label="搜索章节或片段"><div class="filters"><button data-filter="全部" aria-pressed="true">全部</button><button data-filter="主线" aria-pressed="false">主线</button><button data-filter="活动" aria-pressed="false">活动</button><button data-filter="收藏" aria-pressed="false">收藏</button><span id="album-count"></span></div><div id="album-grid" class="album-grid"></div><p id="album-empty" hidden>没有找到这一页，试试其他词或分类。</p></dialog>
<dialog id="timeline" class="sheet timeline-sheet"><header><div><small>章节片段</small><h2 id="timeline-title"></h2></div><button class="close" data-close="timeline" aria-label="关闭时间轴">×</button></header><div id="timeline-list"></div></dialog>
<dialog id="help" class="sheet help-sheet"><header><h2>慢慢走，慢慢看。</h2><button class="close" data-close="help" aria-label="关闭漫游提示">×</button></header><p>拖动沙盘探索四周，用滚轮或双指缩放。底部支持滚轮、拖动或横向滑动选择片段，点击进度打开完整时间轴。</p><p>收藏喜欢的一幕，在章节目录的“收藏”中重新找到它。打开“更多”，可以随机走进另一幕，或开启沿途漫游。</p><p>按 U 隐藏或显示界面，Esc 恢复界面。键盘 ← → 切换片段，Home 回到当前场景，R 随机漫游。拖动沙盘会暂停沿途漫游。</p><button id="help-done">我知道了 →</button></dialog>
<script src="scene-data.js"></script><script src="fog-data.js"></script><script src="engine.js?v=cover-view-2"></script><script src="fog.js"></script><script src="app.js?v=cover-view-2"></script></body></html>
